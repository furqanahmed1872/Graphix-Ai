# ── Port Configuration ───────────────────────────────────────
# All internal port configurations come from .env files:
# - Backend .env: PORT=5000, CLIENT_URL, DATABASE_URL (points to external VPS)
# - Frontend .env: PORT=3000, NEXT_PUBLIC_API_URL
# Docker-compose maps container ports to host ports (5080->5000, 3080->3000)

services:
  # Backend service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: graphix-backend
    # Port mapping: host:container
    # Container port (5000) comes from Backend/.env PORT variable
    ports:
      - "127.0.0.1:5080:5000"
    env_file:
      - ./Backend/.env
    # DATABASE_URL in .env points to external VPS database
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - graphix-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: graphix-frontend
    # Port mapping: host:container
    # Container port (3000) comes from Frontend/.env PORT variable
    ports:
      - "127.0.0.1:3080:3000"
    env_file:
      - ./Frontend/.env
    restart: unless-stopped
    networks:
      - graphix-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  graphix-network:
    driver: bridge
